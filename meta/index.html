<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meta: Codebase Evolution</title>
  <link rel="stylesheet" href="style.css">
  <script src="global.js" type="module"></script>
  <script src="main.js" type="module"></script>
</head>
<body>
  <h1>Meta</h1>
  <p>This page visualizes how my codebase evolved over time.</p>

  <div class="filter-control">
    <label>
      Show commits until:
      <input type="range" id="commit-progress" min="0" max="100" value="100">
      <time id="commit-time"></time>
    </label>
  </div>

  <div id="stats"></div>

  <div id="scrolly-1">
    <div id="scatter-story"></div>

    <div id="scatter-plot">
      <h2>Commits over time</h2>
      <div id="chart"></div>
      <p id="selection-count">No commits selected</p>
      <dl id="language-breakdown" class="info"></dl>
    </div>
  </div>

  <h2>The race for the biggest file</h2>
  <p>Each dot below represents one line of code. Files are sorted by number of lines.</p>
  <dl id="files"></dl>

  <dl id="commit-tooltip" class="info tooltip" hidden>
    <dt>Commit</dt>
    <dd><a href="" id="commit-link" target="_blank"></a></dd>

    <dt>Date</dt>
    <dd id="commit-date"></dd>

    <dt>Time</dt>
    <dd id="commit-time-tooltip"></dd>

    <dt>Author</dt>
    <dd id="commit-author"></dd>

    <dt>Lines edited</dt>
    <dd id="commit-lines"></dd>
  </dl>
</body>
</html>
